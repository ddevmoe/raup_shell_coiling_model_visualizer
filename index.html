<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raup Shell Coiling</title>
<style>
  :root {
    --bg: #f4efe6;
    --panel: #fffaf2;
    --text: #2b241c;
    --muted: #7a6c5c;
    --accent: #b5652b;
    --border: #e0d4c0;
    --viewport: radial-gradient(ellipse at 50% 40%, #fffaf2 0%, #e9dfcf 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f;
      --panel: #211c16;
      --text: #f1e8da;
      --muted: #a89986;
      --accent: #e08a4a;
      --border: #3a3128;
      --viewport: radial-gradient(ellipse at 50% 40%, #2c251d 0%, #120f0b 100%);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f;
    --panel: #211c16;
    --text: #f1e8da;
    --muted: #a89986;
    --accent: #e08a4a;
    --border: #3a3128;
    --viewport: radial-gradient(ellipse at 50% 40%, #2c251d 0%, #120f0b 100%);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 100vh;
  }
  #viewport {
    position: relative;
    background: var(--viewport);
    min-height: 0;
  }
  #viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hint {
    position: absolute; left: 16px; bottom: 12px;
    font-size: 12px; color: var(--muted); pointer-events: none;
  }
  #title {
    position: absolute; left: 16px; top: 12px; pointer-events: none;
  }
  #title h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: 0.01em; }
  #title p { margin: 4px 0 0; font-size: 13px; color: var(--muted); max-width: 420px; }

  aside {
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px;
  }
  .slider { display: flex; flex-direction: column; gap: 6px; }
  .slider-header { display: flex; align-items: baseline; gap: 8px; }
  .slider-header .symbol { color: var(--accent); font-weight: 700; font-style: italic; font-size: 16px; }
  .slider-header h2 { margin: 0; font-size: 14px; flex: 1; }
  .slider-header .value { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .slider input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .slider .range-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .slider p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.4; }

  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 4px 0 -6px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: inherit; font-size: 13px; color: var(--text);
    background: transparent; border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .stats { font-size: 12px; color: var(--muted); line-height: 1.6; font-variant-numeric: tabular-nums; }
  .stats b { color: var(--text); font-weight: 600; }
  .toggles { display: flex; gap: 14px; font-size: 13px; }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
    aside { border-left: none; border-top: 1px solid var(--border); overflow: visible; }
    #title p { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <main id="viewport">
    <div id="title">
      <h1>Raup's shell coiling model</h1>
      <p>A circular generating curve revolves around a fixed axis, growing geometrically as it goes. Three numbers describe almost every coiled shell.</p>
    </div>
    <div id="hint">Drag to orbit · scroll to zoom · adjust the sliders on the right</div>
  </main>

  <aside>
    <div id="sliders" style="display:flex;flex-direction:column;gap:18px"></div>

    <div class="section-label">Presets</div>
    <div class="presets" id="presets"></div>

    <div class="section-label">Display</div>
    <div id="display-sliders"></div>
    <div class="toggles">
      <label><input type="checkbox" id="wireframe"> Wireframe</label>
      <label><input type="checkbox" id="autorotate" checked> Auto-rotate</label>
    </div>

    <div class="stats" id="stats"></div>
  </aside>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const MAX_TURNS = 8;
const MAX_GROWTH_FACTOR = 3000;
const SEGMENTS_PER_TURN = 96;
const MIN_COIL_SEGMENTS = 64;
const TUBE_SEGMENTS = 56;
const FIT_RADIUS = 1.6;
const TRANSITION_DURATION_MS = 1500;

const PRESETS = [
  { name: "Ammonite", W: 2.3, D: 0.35, T: 0 },
  { name: "Nautilus", W: 3.0, D: 0.05, T: 0 },
  { name: "Garden snail", W: 2.2, D: 0.12, T: 1.4 },
  { name: "Turritella", W: 1.18, D: 0.25, T: 5.5 },
  { name: "Clam", W: 10000, D: 0.0, T: 0.25 },
  // A horn grows from the base, but geometrically it is the same open, fast-expanding
  // coil read from tip to base — only about one and a quarter turns of it.
  { name: "Ram's horn", W: 6, D: 0.35, T: 0.7, maxTurns: 1.25 },
];

const params = { W: 2.3, D: 0.35, T: 0, maxTurns: MAX_TURNS };

//region Shell geometry

// Raup (1966): the generating curve is a circle whose centre sits at distance 1
// from the coiling axis. D = (inner edge distance) / (outer edge distance), so the
// tube radius is a = (1 - D) / (1 + D). Every revolution scales the whole curve by W,
// and the centre moves along the axis by T times its radial distance.
function computeRenderedTurns(W, maxTurns) {
  const turnsUntilGrowthCap = Math.log(MAX_GROWTH_FACTOR) / Math.log(W);
  const turns = Math.min(maxTurns, turnsUntilGrowthCap);
  return turns;
}

function shellColor(theta, phi, target) {
  const shellCream = [0.95, 0.87, 0.74];
  const shellBrown = [0.52, 0.28, 0.14];
  const spiralBands = 0.5 + 0.5 * Math.cos(phi * 4 + theta * 0.15);
  const bandMix = Math.pow(spiralBands, 6) * 0.75;
  const growthLine = Math.pow(0.5 + 0.5 * Math.cos(theta * 14), 40) * 0.25;
  const mix = Math.min(1, bandMix + growthLine);
  for (let channel = 0; channel < 3; channel++) {
    target[channel] = shellCream[channel] * (1 - mix) + shellBrown[channel] * mix;
  }
}

function buildShellGeometry({ W, D, T, maxTurns }) {
  const tubeRadius = (1 - D) / (1 + D);
  const turns = computeRenderedTurns(W, maxTurns);
  const thetaMax = turns * 2 * Math.PI;
  const growthPerRadian = Math.log(W) / (2 * Math.PI);
  const coilSegments = Math.max(MIN_COIL_SEGMENTS, Math.ceil(turns * SEGMENTS_PER_TURN));

  const vertexCount = (coilSegments + 1) * (TUBE_SEGMENTS + 1);
  const positions = new Float32Array(vertexCount * 3);
  const colors = new Float32Array(vertexCount * 3);
  const color = [0, 0, 0];

  let vertexIndex = 0;
  for (let i = 0; i <= coilSegments; i++) {
    // Coil from the apex (-thetaMax) up to the aperture (0). Anchoring the aperture
    // at a fixed angle keeps the shell from spinning when W changes the turn count.
    const theta = -thetaMax + (thetaMax * i) / coilSegments;
    const scale = Math.exp(growthPerRadian * theta);
    for (let j = 0; j <= TUBE_SEGMENTS; j++) {
      const phi = (2 * Math.PI * j) / TUBE_SEGMENTS;
      const radialDistance = scale * (1 + tubeRadius * Math.cos(phi));
      const axialDistance = scale * (T + tubeRadius * Math.sin(phi));
      positions[vertexIndex * 3] = radialDistance * Math.cos(theta);
      positions[vertexIndex * 3 + 1] = -axialDistance;
      positions[vertexIndex * 3 + 2] = radialDistance * Math.sin(theta);
      shellColor(theta, phi, color);
      colors.set(color, vertexIndex * 3);
      vertexIndex++;
    }
  }

  const indices = [];
  const rowLength = TUBE_SEGMENTS + 1;
  for (let i = 0; i < coilSegments; i++) {
    for (let j = 0; j < TUBE_SEGMENTS; j++) {
      const a = i * rowLength + j;
      const b = (i + 1) * rowLength + j;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();

  const center = new THREE.Vector3();
  geometry.boundingBox.getCenter(center);
  geometry.translate(-center.x, -center.y, -center.z);
  geometry.computeBoundingSphere();
  const fitScale = FIT_RADIUS / geometry.boundingSphere.radius;
  geometry.scale(fitScale, fitScale, fitScale);

  const result = { geometry, turns, tubeRadius, finalGrowth: Math.exp(growthPerRadian * thetaMax) };
  return result;
}

//endregion

//region Scene

const viewport = document.getElementById("viewport");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
camera.position.set(3.2, 2.4, 3.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 1.5;
controls.maxDistance = 15;

scene.add(new THREE.HemisphereLight(0xfff6e8, 0x3a2a1c, 1.1));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
keyLight.position.set(4, 6, 3);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xffd9b0, 0.7);
rimLight.position.set(-5, -2, -4);
scene.add(rimLight);

const material = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.45,
  metalness: 0.05,
  side: THREE.DoubleSide,
});
const shellMesh = new THREE.Mesh(new THREE.BufferGeometry(), material);
scene.add(shellMesh);

function resize() {
  const { clientWidth, clientHeight } = viewport;
  renderer.setSize(clientWidth, clientHeight, false);
  camera.aspect = clientWidth / clientHeight;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewport);
resize();

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

//endregion

//region Sliders

// The range input always spans 0..SLIDER_RESOLUTION; each slider maps that
// fraction onto its own (possibly logarithmic) parameter range.
const SLIDER_RESOLUTION = 1000;

function createSlider({ key, symbol, title, description, min, max, logarithmic, format }) {
  const toFraction = (value) => logarithmic
    ? Math.log(value / min) / Math.log(max / min)
    : (value - min) / (max - min);
  const fromFraction = (fraction) => logarithmic
    ? min * Math.pow(max / min, fraction)
    : min + fraction * (max - min);

  const wrapper = document.createElement("div");
  wrapper.className = "slider";
  wrapper.innerHTML = `
    <div class="slider-header">
      <span class="symbol">${symbol}</span>
      <h2>${title}</h2>
      <span class="value"></span>
    </div>
    <input type="range" min="0" max="${SLIDER_RESOLUTION}" step="1" aria-label="${title}">
    <div class="range-labels"><span>${format(min)}</span><span>${format(max)}</span></div>
    <p>${description}</p>`;

  const input = wrapper.querySelector("input");
  const valueText = wrapper.querySelector(".value");

  input.addEventListener("input", () => {
    cancelTransition();
    params[key] = fromFraction(Number(input.value) / SLIDER_RESOLUTION);
    onParamsChanged();
  });

  function render() {
    input.value = String(Math.round(toFraction(params[key]) * SLIDER_RESOLUTION));
    valueText.textContent = format(params[key]);
    input.setAttribute("aria-valuetext", format(params[key]));
  }

  const slider = { element: wrapper, render };
  return slider;
}

function formatW(value) {
  if (value >= 1000) {
    const formatted = `10^${Math.log10(value).toFixed(1)}`;
    return formatted;
  }
  const formatted = value < 10 ? value.toFixed(2) : value.toFixed(0);
  return formatted;
}

const sliders = [
  createSlider({
    key: "W", symbol: "W", title: "Whorl expansion rate",
    description: "How much the generating curve enlarges per revolution (log scale). Low: many tight whorls. Very high: a clam-like valve.",
    min: 1.05, max: 100000, logarithmic: true, format: formatW,
  }),
  createSlider({
    key: "D", symbol: "D", title: "Distance from axis",
    description: "Inner / outer edge distance of the curve from the coiling axis. 0 touches the axis; higher opens a central umbilicus.",
    min: 0, max: 0.95, logarithmic: false, format: (value) => value.toFixed(2),
  }),
  createSlider({
    key: "T", symbol: "T", title: "Translation rate",
    description: "Movement along the axis relative to outward growth. 0 is planispiral (ammonite); high values give tall spires.",
    min: 0, max: 8, logarithmic: false, format: (value) => value.toFixed(2),
  }),
];

const turnsSlider = createSlider({
  key: "maxTurns", symbol: "N", title: "Max turns",
  description: "Not a model input: just how much of the coil to draw. Fast-growing shells also stop once they have grown 3000×.",
  min: 0.25, max: MAX_TURNS, logarithmic: false, format: (value) => value.toFixed(2),
});

const sliderContainer = document.getElementById("sliders");
for (const slider of sliders) {
  sliderContainer.appendChild(slider.element);
}
document.getElementById("display-sliders").appendChild(turnsSlider.element);
sliders.push(turnsSlider);

//endregion

//region Wiring

const statsElement = document.getElementById("stats");

function describeOverlap({ W, D }) {
  // Raup's W = 1/D curve. The previous whorl's outer edge sits at (1 + a) / W and the
  // current inner edge at (1 - a), so the whorls clear each other only when D·W ≥ 1.
  const overlapping = D * W < 1;
  const description = overlapping ? "whorls overlap (involute)" : "whorls free (evolute / open)";
  return description;
}

let rebuildScheduled = false;

function rebuildShell() {
  rebuildScheduled = false;
  const { geometry, turns, tubeRadius, finalGrowth } = buildShellGeometry(params);
  shellMesh.geometry.dispose();
  shellMesh.geometry = geometry;
  statsElement.innerHTML = [
    `Rendered turns: <b>${turns.toFixed(2)}</b>`,
    `Size growth apex → aperture: <b>×${finalGrowth.toFixed(0)}</b>`,
    `Tube radius / centre distance: <b>${tubeRadius.toFixed(2)}</b>`,
    `Planispiral D·W = <b>${(params.D * params.W).toFixed(2)}</b> → ${describeOverlap(params)}`,
  ].join("<br>");
}

function onParamsChanged() {
  for (const slider of sliders) {
    slider.render();
  }
  if (rebuildScheduled) return;
  rebuildScheduled = true;
  requestAnimationFrame(rebuildShell);
}

//endregion

//region Preset transitions

let activeTransition = null;

function interpolate(from, to, progress) {
  const value = from + (to - from) * progress;
  return value;
}

function easeInOutCubic(progress) {
  const eased = progress < 0.5
    ? 4 * progress ** 3
    : 1 - (-2 * progress + 2) ** 3 / 2;
  return eased;
}

function cancelTransition() {
  activeTransition = null;
}

function stepTransition(timestamp) {
  if (!activeTransition) return;

  const { start, end, finalMaxTurns, startTime } = activeTransition;
  const elapsedMs = Math.max(0, timestamp - startTime);
  const progress = Math.min(1, elapsedMs / TRANSITION_DURATION_MS);
  const eased = easeInOutCubic(progress);

  // W is multiplicative, so interpolate it in log space; a linear blend from
  // 10000 to 6 would race through the interesting low values in a single frame.
  params.W = Math.exp(interpolate(Math.log(start.W), Math.log(end.W), eased));
  params.D = interpolate(start.D, end.D, eased);
  params.T = interpolate(start.T, end.T, eased);
  params.maxTurns = interpolate(start.renderedTurns, end.renderedTurns, eased);

  if (progress === 1) {
    params.maxTurns = finalMaxTurns;
    activeTransition = null;
  }
  onParamsChanged();

  if (activeTransition) {
    requestAnimationFrame(stepTransition);
  }
}

function startTransition(preset) {
  const finalMaxTurns = preset.maxTurns ?? MAX_TURNS;
  // Blend the turns actually drawn rather than the "max turns" setting, so a clam
  // (capped by growth at <1 turn) doesn't balloon to 8 turns mid-transition.
  const start = { ...params, renderedTurns: computeRenderedTurns(params.W, params.maxTurns) };
  const end = { ...preset, renderedTurns: computeRenderedTurns(preset.W, finalMaxTurns) };
  activeTransition = { start, end, finalMaxTurns, startTime: performance.now() };
  requestAnimationFrame(stepTransition);
}

const presetContainer = document.getElementById("presets");
for (const preset of PRESETS) {
  const button = document.createElement("button");
  button.textContent = preset.name;
  button.addEventListener("click", () => startTransition(preset));
  presetContainer.appendChild(button);
}

document.getElementById("wireframe").addEventListener("change", (event) => {
  material.wireframe = event.target.checked;
});
document.getElementById("autorotate").addEventListener("change", (event) => {
  controls.autoRotate = event.target.checked;
});

onParamsChanged();

//endregion
</script>
</body>
</html>
